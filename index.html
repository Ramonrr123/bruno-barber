<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/jpeg" href="/brunologo.jpg" />
    <link rel="apple-touch-icon" href="/brunologo.jpg" />

    <!-- Preload da logo principal -->
    <link rel="preload" as="image" href="/brunologo.jpg" type="image/jpeg" fetchpriority="high" />

    <!-- Preconnect Google Fonts para reduzir latência de DNS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Carregamento não-bloqueante da fonte (font-display: swap via Google) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    </noscript>

    <title>Kings Barber Shop | Agendamento</title>
    <meta name="description" content="Agende seu horário na Kings Barber Shop em segundos. Cortes modernos, atendimento premium." />

    <meta property="og:title" content="Kings Barber Shop" />
    <meta property="og:description" content="Agende seu corte em segundos. Cortes modernos, atendimento premium." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
